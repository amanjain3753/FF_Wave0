common_libraries: &common_libraries
  - whl: /Workspace/Shared/simple_framework_whl_v2/simpel_framework-2.1.5a0-py3-none-any.whl
  - whl: /Workspace/MWD30ANAPLAN/.bundle/mwd30anaplan/${var.env_var}/artifacts/.internal/mwd30anaplan-0.1.0-py3-none-any.whl

resources:
  jobs:
    imo_fin_anaplan_driver_pl:
      name: "IMO_FIN_ANAPLAN_DRIVER_PL"

      run_as:
        service_principal_name: ${var.run_as_sp_name}

      permissions:
        - level: CAN_MANAGE
          group_name: ${var.group}

      schedule:
        quartz_cron_expression: 0 0 6 ? * TUE   # Run daily at 6:00 UTC
        timezone_id: UTC
        pause_status: ${var.imo_pause_status}

      email_notifications:
        on_failure:
          - aman.jain@effem.com
          - parul.parul@effem.com

      tasks:
        - task_key: trigger_date_check
          description: "get year_period_list and trigger_date"
          python_wheel_task:
            package_name: mwd30anaplan
            entry_point: run_etl
            parameters:
              - --process_name
              - TRIGGER_DATE_CHECK_IMO
              - --environment
              - ${var.param_env}
              - --is_refresh_day
              - "{{job.parameters.is_refresh_day}}"
              - --year_period_list
              - "{{job.parameters.year_period_list}}"
          job_cluster_key: mwd30anaplan_job_cluster
          libraries: *common_libraries

        - task_key: check_if_trigger_date_today
          depends_on:
            - task_key: trigger_date_check
          condition_task:
            left: "{{tasks.trigger_date_check.values.is_refresh_day}}"
            op: "EQUAL_TO"
            right: "true"

        - task_key: customer_masterdata
          depends_on:
            - task_key: check_if_trigger_date_today
              outcome: "true"
          description: "Process Customer Masterdata from SAP"
          python_wheel_task:
            package_name: mwd30anaplan
            entry_point: run_etl
            parameters:
              - --process_name
              - CUSTOMER_MASTERDATA
              - --environment
              - ${var.param_env}
              - --year_period_list
              - "{{tasks.trigger_date_check.values.year_period_list}}"
          job_cluster_key: mwd30anaplan_job_cluster
          libraries: *common_libraries

        - task_key: product_masterdata
          depends_on:
            - task_key: check_if_trigger_date_today
              outcome: "true"
          description: "Process Product Masterdata from SAP"
          python_wheel_task:
            package_name: mwd30anaplan
            entry_point: run_etl
            parameters:
              - --process_name
              - PRODUCT_MASTERDATA
              - --environment
              - ${var.param_env}
              - --year_period_list
              - "{{tasks.trigger_date_check.values.year_period_list}}"
          job_cluster_key: mwd30anaplan_job_cluster
          libraries: *common_libraries

        - task_key: uom_process
          depends_on:
            - task_key: product_masterdata
          description: "Process UOM from product masterdata"
          python_wheel_task:
            package_name: mwd30anaplan
            entry_point: run_etl
            parameters:
              - --process_name
              - UOM_PROCESS
              - --environment
              - ${var.param_env}
              - --year_period_list
              - "{{tasks.trigger_date_check.values.year_period_list}}"
          job_cluster_key: mwd30anaplan_job_cluster
          libraries: *common_libraries

        - task_key: IMO_FIN_PROCESS_MASTER_TASK
          depends_on:
            - task_key: customer_masterdata
            - task_key: product_masterdata
            - task_key: uom_process
          description: "Run all downstream processes concurrently"
          for_each_task:
            inputs: "{{job.parameters.TASK_EXECUTION_LIST}}"
            concurrency: 10
            task:
              task_key: IMO_FIN_PROCESS_TASK
              python_wheel_task:
                package_name: mwd30anaplan
                entry_point: run_etl
                parameters:
                  - --process_name
                  - "{{input}}"
                  - --environment
                  - ${var.param_env}
                  - --year_period_list
                  - "{{tasks.trigger_date_check.values.year_period_list}}"
              job_cluster_key: mwd30anaplan_job_cluster
              libraries: *common_libraries

        - task_key: imo_fin_anaplan_api_process
          depends_on:
            - task_key: IMO_FIN_PROCESS_MASTER_TASK
          description: "Send IMO Fin data to Anaplan"
          python_wheel_task:
            package_name: mwd30anaplan
            entry_point: run_etl
            parameters:
              - --process_name
              - IMO_FIN_ANAPLAN_API_PROCESS
              - --environment
              - ${var.param_env}
              - --year_period_list
              - "{{tasks.trigger_date_check.values.year_period_list}}"
          job_cluster_key: mwd30anaplan_job_cluster
          libraries: *common_libraries

      job_clusters:
        - job_cluster_key: mwd30anaplan_job_cluster
          new_cluster:
            cluster_name: ""
            spark_version: "16.4.x-scala2.12"
            spark_env_vars:
              cicd_sp_client_id: "{{secrets/${var.secret_scope}/dna-dbs-sp-cicd-appid}}"
              cicd_sp_client_secret: "{{secrets/${var.secret_scope}/dna-dbs-sp-cicd-appsecret}}"
            node_type_id: "Standard_D4ads_v5"
            driver_node_type_id: "Standard_D8ads_v5"
            autoscale:
              min_workers: 1
              max_workers: 8
            instance_pool_id: ${var.instance_pool_id}
            driver_instance_pool_id: ${var.instance_pool_id}
            runtime_engine: "STANDARD"
            data_security_mode: USER_ISOLATION
            policy_id: ${var.policy_id}

      parameters:
        - name: year_period_list
          default: ""
        - name: is_refresh_day
          default: ""
        - name: TASK_EXECUTION_LIST
          default: '["CUSTOMER_PRICE_LIST","STANDARD_COST","ICP","TPM_PROCESS","SUPPLY","DEMAND_PROCESS"]'