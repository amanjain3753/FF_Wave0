files: ^FF_Wave0
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
    # - id: check-yaml
    - id: check-json
    - id: pretty-format-json
      args: ['--autofix']
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-added-large-files
      args: ['--maxkb=2048']

- repo: https://github.com/ambv/black
  rev: 23.7.0
  hooks:
    - id: black
      types: [python]
      stages: [commit]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.0.286
  hooks:
    - id: ruff
      args: [--show-fixes, --exit-non-zero-on-fix]

# - repo: https://github.com/pre-commit/mirrors-mypy
#   rev: v1.5.1
#   hooks:
#     - id: mypy
#       additional_dependencies: [types-croniter]
#       exclude: test/


# ====================================================================================
# the configs for these tools is setup in pyproject.toml and are picked up from there

# pre-commit install --install-hooks
# to update the references in the hooks run pre-commit autoupdate

# test with precommit by running pre-commit run --all-files
# to skip the procommits from triggering use git commit --no-verify -m "message"
